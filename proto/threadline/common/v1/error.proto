syntax = "proto3";

package threadline.common.v1;

option go_package = "github.com/monkeylabx/threadline/services/gen/proto/threadline/common/v1;commonv1";
option java_multiple_files = true;
option java_outer_classname = "ErrorProto";
option java_package = "com.monkeylabx.threadline.generated.common.v1";
option swift_prefix = "TL";

// ErrorEnvelope is the stable, transport-independent failure shape exposed to
// first-party clients. Transport adapters map it to and from their native error
// mechanism without exposing internal exceptions, SQL, paths, secrets, or
// user content.
message ErrorEnvelope {
  // domain is a stable bounded namespace such as "identity" or "sync".
  string domain = 1;

  // code is a stable machine-readable value within domain. Clients must map
  // unknown values to their controlled unknown fallback.
  string code = 2;

  // retryable is true only when repeating the operation can be safe.
  bool retryable = 3;

  // user_message_key is a safe localization key, never user-visible prose.
  string user_message_key = 4;

  // trace_id is an optional opaque correlation identifier. It must not contain
  // credentials, message content, file paths, or cryptographic material.
  optional string trace_id = 5;
}
