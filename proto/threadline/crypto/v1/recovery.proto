syntax = "proto3";

// History Sharing and Enterprise Recovery, per ADR-0003 sections 6 and 7.
//
// Both are Threadline application-layer protocols layered above MLS. Neither
// modifies MLS itself, and neither may become a general server-side decryption
// interface for search, DLP, summarization or model input.
package threadline.crypto.v1;

import "google/protobuf/timestamp.proto";
import "threadline/crypto/v1/crypto.proto";
import "threadline/type/v1/common.proto";

// HistorySharingGrant is an explicit, auditable transfer of retained pre-join
// history access to a newly authorized Member.
//
// The server routes this envelope but cannot open it. It must never hand out
// history keys on the strength of current membership alone.
message HistorySharingGrant {
  string grant_id = 1;

  string e2ee_group_id = 2;

  // Device that re-wrapped the History Keys. An existing authorized Device of a
  // current member, never a server workload.
  string source_device_id = 3;

  // Device receiving history access.
  string target_device_id = 4;

  // Epoch range covered, inclusive. Bounded by retention and by what the source
  // Device still holds; a source cannot share what it has already erased.
  uint64 first_epoch = 5;
  uint64 last_epoch = 6;

  // History Keys for `first_epoch`..`last_epoch`, sealed to the target Device.
  // Opaque outside client-crypto. This is not an MLS Ratchet Secret and not a
  // reusable Channel key.
  bytes wrapped_history_keys = 7;

  // Profile under which the wrapping was performed.
  CryptoProfile crypto_profile = 8;

  // Policy version that authorized the share, retained so an auditor can
  // explain the decision after the policy changes.
  string policy_version = 9;

  google.protobuf.Timestamp created_at = 10;

  // History access is bounded by retention. After this instant a correctly
  // operating client erases the keys even while offline.
  google.protobuf.Timestamp retention_expires_at = 11;

  // Explicit tenant and request binding prevent a sealed grant from being
  // replayed into another tenant or a broader later request.
  string tenant_id = 12;
  string request_id = 13;

  // The grant expires at the earlier of this value and
  // `retention_expires_at`. It never grants access to a successor Epoch.
  google.protobuf.Timestamp expires_at = 14;

  // Signature by `source_device_id` over the `history` v1 canonical transcript
  // of fields 1-14. The service routes this opaque grant; the target Device
  // verifies it before unwrapping.
  bytes source_signature = 15;
}

// HistorySharingRequest freezes the authorized range before any source Device
// produces a grant. An unavailable source produces no grant and never widens
// this request into automatic pre-join history access.
message HistorySharingRequest {
  string request_id = 1;
  string tenant_id = 2;
  string e2ee_group_id = 3;
  string target_device_id = 4;
  uint64 first_epoch = 5;
  uint64 last_epoch = 6;
  string policy_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp retention_expires_at = 10;
}

// RecoveryScope is one explicit Group/Epoch/time slice. Scopes cannot be
// inferred from tenant membership, and an empty scope list is invalid. For v1
// N-1 dual-write compatibility, every scope in one Case has exactly the same
// Epoch bounds and TimeRange; heterogeneous bounds fail closed and are never
// widened into a union.
message RecoveryScope {
  string e2ee_group_id = 1;
  uint64 first_epoch = 2;
  uint64 last_epoch = 3;
  threadline.type.v1.TimeRange time_range = 4;

  // Exact object identities or bounded History ranges authorized inside this
  // Group/Epoch/time slice. Current v1 requires a non-empty list. Entries are
  // unique and sorted: objects by kind wire number then resource_id; History
  // by Group ID, first_epoch, then last_epoch. An object must match exactly;
  // an envelope History range must be contained by an approved target.
  repeated RecoveryProtectedScope protected_targets = 5;
}

// RecoveryCaseState is the legacy Recovery Case lifecycle.
//
//	DRAFT -> PENDING_APPROVAL -> APPROVED -> EXECUTED
//	              |                  |
//	              +-> REJECTED       +-> EXPIRED
//	              +-> EXPIRED        +-> REVOKED
//
// There is no transition back into APPROVED. A lapsed case must be requested
// and approved again from DRAFT.
enum RecoveryCaseState {
  RECOVERY_CASE_STATE_UNSPECIFIED = 0;
  RECOVERY_CASE_STATE_DRAFT = 1;
  RECOVERY_CASE_STATE_PENDING_APPROVAL = 2;
  RECOVERY_CASE_STATE_APPROVED = 3;
  // The KMS/HSM performed the scope-bound unwrap and the result was delivered
  // to the Recovery Recipient Device. Terminal.
  RECOVERY_CASE_STATE_EXECUTED = 4;
  RECOVERY_CASE_STATE_REJECTED = 5;
  RECOVERY_CASE_STATE_EXPIRED = 6;
  // Withdrawn before execution.
  RECOVERY_CASE_STATE_REVOKED = 7;
}

// Legacy approval contract. Its field meanings and numbering are unchanged.
message RecoveryApproval {
  string approval_id = 1;
  threadline.type.v1.ActorRef approver = 2;
  bool approved = 3;
  threadline.type.v1.EncryptedField note = 4;
  google.protobuf.Timestamp decided_at = 5;
  string policy_version = 6;
}

// Legacy Recovery contract retained byte-for-byte for existing clients. New
// targeted recovery never serializes into or reinterprets this message.
message RecoveryCase {
  string recovery_case_id = 1;
  string tenant_id = 2;
  threadline.type.v1.ActorRef requester = 3;
  threadline.type.v1.EncryptedField reason = 4;
  repeated string e2ee_group_ids = 5;
  uint64 first_epoch = 6;
  uint64 last_epoch = 7;
  threadline.type.v1.TimeRange time_range = 8;
  string recovery_recipient_device_id = 9;
  RecoveryCaseState state = 10;
  uint32 required_approvals = 11;
  repeated RecoveryApproval approvals = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp expires_at = 14;
  google.protobuf.Timestamp executed_at = 15;
}

// TargetedRecoveryApproval is one approver's decision on a Recovery Case.
//
// v1 requires at least two distinct approvers and forbids self-approval. An
// organization may raise the threshold but never lower it to one.
message TargetedRecoveryApproval {
  string approval_id = 1;

  threadline.type.v1.ActorRef approver = 2;

  bool approved = 3;

  // Free-text justification, entered by the approver. Data class C3: it may
  // describe the incident, so it is stored encrypted and never logged.
  threadline.type.v1.EncryptedField note = 4;

  google.protobuf.Timestamp decided_at = 5;

  // Organization policy version in force at decision time.
  string policy_version = 6;

  // Client-generated idempotency key for this approver and case. Reusing it
  // with another decision fails with ERROR_CODE_REPLAY_DETECTED.
  string decision_id = 7;

  // Digest of the authoritative `recovery-case` v1 canonical transcript:
  // recovery_case_id, request_id, Tenant, requester ActorRef identity (actor_id
  // and actor_type), encrypted-reason binding, canonical `scopes`, one
  // recipient Device, required approval count, expiry and policy. No legacy
  // RecoveryCase projection participates in this targeted transcript.
  // The Case is immutable after the first decision; a changed projection
  // invalidates every approval and cannot be replayed to another request/Case.
  bytes case_binding_hash = 8;

  // Device signature over the `recovery-decision` v1 canonical transcript of
  // `case_binding_hash` followed by the canonical
  // DecideTargetedRecoveryCaseRequest fields 1-4 and 7: recovery_case_id, approved,
  // the complete encrypted note (ciphertext, e2ee_group_id, epoch,
  // crypto_profile and envelope_version), decision_id and approver_device_id.
  // Service-generated approval_id, approver ActorRef and decided_at are
  // excluded. Policy is already covered by case_binding_hash.
  bytes decision_signature = 9;

  // Authorized Device that signed the decision. It is copied unchanged from
  // the request after the service verifies that it matches the caller session.
  string approver_device_id = 10;
}

// TargetedRecoveryCase is a time-bounded, auditable request to recover a defined set of
// retained Epochs for exactly one designated recipient Device.
//
// It is not standing access to a Tenant, Channel or DM, and it is not a device
// sync path: a new Device that has no eligible source Device starts from its
// current authorization point unless a case like this is separately approved.
message TargetedRecoveryCase {
  string recovery_case_id = 1;

  string tenant_id = 2;

  threadline.type.v1.ActorRef requester = 3;

  // Why recovery is being requested. Data class C3, stored encrypted: the
  // reason routinely names people and incidents.
  threadline.type.v1.EncryptedField reason = 4;

  // The one explicitly approved Device that receives the result end to end.
  // Recovery Control and administrator interfaces are never recipients.
  string recovery_recipient_device_id = 5;

  RecoveryCaseState state = 6;

  // Threshold in force when the case was created, so a later policy change
  // cannot retroactively make an under-approved case valid.
  uint32 required_approvals = 7;

  repeated TargetedRecoveryApproval approvals = 8;

  google.protobuf.Timestamp created_at = 9;

  // After this instant the authorization and any temporary material are dead.
  // Recovering again requires a fresh case and fresh approvals.
  google.protobuf.Timestamp expires_at = 10;

  google.protobuf.Timestamp executed_at = 11;

  // Canonical v1 scope. Entries are unique by e2ee_group_id and serialized in
  // ascending bytewise e2ee_group_id order. Every entry binds its Group and the
  // same shared inclusive Epoch bounds and half-open TimeRange; heterogeneous
  // bounds fail closed rather than being widened. Current writers never
  // serialize this targetful authority into the separate legacy RecoveryCase.
  // N-1 binaries do not know TargetedRecoveryService and receive UNIMPLEMENTED.
  repeated RecoveryScope scopes = 12;

  // Policy snapshot and stable replay identity for the high-impact request.
  string policy_version = 13;
  string request_id = 14;

  // Set once at successful execution. Empty is invalid. The same non-empty ID
  // is idempotent; another ID after execution is ERROR_CODE_REPLAY_DETECTED.
  string execution_id = 15;

  // SHA-256 of the `recovery-reason` v1 canonical transcript of the complete
  // EncryptedField in field 4. No plaintext or free-floating digest is used.
  bytes reason_binding_hash = 16;
}

// RecoveryEnvelope is versioned material that binds recoverability to one E2EE
// Group, Epoch and enterprise recovery-key version.
//
// It is stored alongside the ciphertext it covers. It does not contain, and
// cannot be used to derive, a reusable group master key. Only the isolated
// KMS/HSM identity can unwrap it, and only inside an approved Recovery Case.
// RecoveryProtectedHistoryRange identifies a bounded History slice. Both Epoch
// bounds are inclusive and first_epoch must not exceed last_epoch.
message RecoveryProtectedHistoryRange {
  string e2ee_group_id = 1;
  uint64 first_epoch = 2;
  uint64 last_epoch = 3;
}

enum RecoveryObjectKind {
  RECOVERY_OBJECT_KIND_UNSPECIFIED = 0;
  RECOVERY_OBJECT_KIND_EVENT = 1;
  RECOVERY_OBJECT_KIND_BLOB = 2;
  RECOVERY_OBJECT_KIND_ARTIFACT = 3;
}

// Exact durable object protected by the envelope. Kind is part of the scope
// binding so IDs from different resource namespaces cannot be substituted.
message RecoveryObjectRef {
  RecoveryObjectKind kind = 1;
  string resource_id = 2;
}

// RecoveryProtectedScope is the authoritative wire description of what one
// sender-authored RecoveryEnvelope protects. Exactly one target is present. It
// contains no post-commit server fact or timestamp.
message RecoveryProtectedScope {
  oneof target {
    RecoveryObjectRef object = 1;
    RecoveryProtectedHistoryRange history_epoch_range = 2;
  }
}

// Core-generated proof that the durable record carrying an envelope committed
// at a particular point in the Channel chain. Core creates it only after the
// durable commit. Recovery Control verifies the checkpoint signature and chain,
// binds tenant/Group/Epoch/scope_hash to the unchanged sender envelope, and uses
// server_committed_at as the sole Recovery Case TimeRange input.
message RecoveryScopeCommitAttestation {
  string tenant_id = 1;
  string e2ee_group_id = 2;
  uint64 epoch = 3;
  bytes scope_hash = 4;
  string event_id = 5;
  uint64 channel_seq = 6;
  google.protobuf.Timestamp server_committed_at = 7;
  bytes chain_hash = 8;
  string checkpoint_key_id = 9;

  // Signature over the `recovery-commit-attestation` v1 canonical transcript
  // of fields 1-9, 11 and 12. Algorithm/provider admission is outside this
  // transcript contract.
  bytes checkpoint_signature = 10;

  // Digest of the `recovery-envelope` v1 canonical transcript of the exact
  // persisted sender envelope: fields 1-12 and 18, with delivery-only fields
  // 13-17 represented as absent/null. Recovery Control matches this digest to
  // the approved envelope requested from Core.
  bytes recovery_envelope_hash = 11;

  // SHA-256 of the `channel-event-sender-binding` v1 JCS canonical transcript
  // of T015 ChannelEventEnvelope sender-authored fields 1-6, 8-12, 14-15, 18,
  // and 20-23. Field 20 contributes the domain-separated exact
  // `recovery-envelope` hash. Core verifies sender_signature over this same
  // projection before computing the digest. ServerCommit and sender_signature
  // are excluded. This binds event_id to the authenticated sender event rather
  // than accepting an administrator- or client-supplied event assertion.
  bytes sender_event_binding_hash = 12;
}

// Minimal signed capability Recovery Control issues only after a Case is
// APPROVED. It contains no reason, approval note or plaintext. Core verifies
// the caller mTLS workload identity, signature, Grant expiry and Case expiry,
// then discovers exact persisted records from its single durable event store
// within these scopes. Grant expiry must not outlive Case expiry.
message RecoveryEvidenceGrant {
  string recovery_case_id = 1;
  string tenant_id = 2;
  repeated RecoveryScope approved_scopes = 3;
  string recipient_device_id = 4;
  google.protobuf.Timestamp expires_at = 5;
  string policy_version = 6;
  string execution_id = 7;
  bytes case_binding_hash = 8;

  // Recovery Control signature over the `recovery-evidence-grant` v1
  // canonical transcript of fields 1-8.
  bytes recovery_control_signature = 9;
}

message RecoveryEnvelope {
  // Golden Frame unknown-field canary. This number must remain unknown to
  // generated adapters so compatibility tests can prove decode/re-encode
  // preservation across versions.
  reserved 50000;

  string tenant_id = 1;

  string e2ee_group_id = 2;

  uint64 epoch = 3;

  CryptoProfile crypto_profile = 4;

  // Enterprise recovery key version used for wrapping. Rotation applies to new
  // Epochs only: Threadline does not batch-rewrite existing messages.
  uint32 recovery_key_version = 5;

  // KMS/HSM identifier of the recovery key this envelope was wrapped to, e.g.
  // "recovery-key-2026-q3". The version above orders rotations; this names the
  // key an approved Recovery Case must ask the KMS/HSM to use, which a number
  // cannot do. Matches `recovery.recipient_key_id` in the T011 interop vector.
  string recovery_key_id = 9;

  // Legacy digest over exactly tenant, group, epoch, profile and recovery key
  // ID. This v1 meaning is immutable and does not include additive scope fields.
  // A recipient checks it before unwrapping so material re-pointed at another
  // group, Epoch or tenant fails closed. Asserted as `recovery.binding_sha256`
  // in test/crypto/e2ee-interop-v1.vector.
  bytes binding_hash = 10;

  // SHA-256 digest of the `recovery-protected-scope` v1 canonical transcript of
  // field 18.
  bytes scope_hash = 11;

  // SHA-256 digest of the `recovery-scope-binding` v1 canonical transcript containing
  // the complete legacy binding projection above plus `scope_hash`. Current
  // scoped execution requires fields 11, 12 and 18; an N-1 envelope without
  // them remains readable/preservable but is not executable as current scope.
  bytes scope_binding_hash = 12;

  // Scope-bound wrapped material for `epoch`. Opaque to every application
  // service, including Recovery Control itself, which orchestrates approvals
  // but never sees recovery private key bytes. This message is also the
  // baseline ExecuteTargetedRecoveryCaseResponse delivery type.
  bytes wrapped_material = 6;

  // Format version of `wrapped_material` within `crypto_profile`.
  uint32 envelope_version = 7;

  // Whether this envelope was produced at all.
  //
  // v1 does not expose strictly unrecoverable Channels to users, but the
  // protocol must keep room to omit the enterprise recovery recipient later.
  // A false value here is the version boundary that makes that possible without
  // a wire break.
  bool recovery_recipient_present = 8;

  // Additive current-delivery metadata. These fields are absent on stored
  // RecoveryEnvelope frames and required on ExecuteTargetedRecoveryCase results.
  string recovery_case_id = 13;
  string recovery_recipient_device_id = 14;
  string delivery_policy_version = 15;
  google.protobuf.Timestamp delivery_expires_at = 16;

  // Digest over the `recovery-delivery` v1 canonical transcript of fields 1-16
  // and 18 in field-number order. Field 17 is the digest itself and is excluded. This
  // binds the legacy tenant/Group/Epoch/Profile/key/material fields, both scope
  // bindings, Case, one recipient, policy and expiry against substitution.
  bytes delivery_binding_hash = 17;

  // Authoritative sender-authored exact object or bounded History scope.
  // Required for current stored frames and Execute results; absent on N-1.
  RecoveryProtectedScope protected_scope = 18;
}
