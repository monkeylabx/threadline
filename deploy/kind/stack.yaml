apiVersion: v1
kind: Namespace
metadata:
  name: threadline-dev
  labels:
    app.kubernetes.io/part-of: threadline
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: threadline-recovery-dev
  labels:
    app.kubernetes.io/part-of: threadline
    threadline.io/trust-boundary: recovery-control
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: threadline-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: threadline-dev
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-otel-metrics
  namespace: threadline-dev
spec:
  podSelector:
    matchLabels: {app: prometheus}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: otel-collector}
      ports:
        - {protocol: TCP, port: 8889}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-metrics-from-prometheus
  namespace: threadline-dev
spec:
  podSelector:
    matchLabels: {app: otel-collector}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: prometheus}
      ports:
        - {protocol: TCP, port: 8889}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-to-jaeger
  namespace: threadline-dev
spec:
  podSelector:
    matchLabels: {app: otel-collector}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: jaeger}
      ports:
        - {protocol: TCP, port: 4317}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jaeger-otlp-from-otel
  namespace: threadline-dev
spec:
  podSelector:
    matchLabels: {app: jaeger}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: otel-collector}
      ports:
        - {protocol: TCP, port: 4317}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recovery-control-placeholder-deny-all
  namespace: threadline-recovery-dev
  annotations:
    threadline.io/purpose: No recovery workload or KMS/HSM route is configured by T016
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev-only-credentials
  namespace: threadline-dev
  annotations:
    threadline.io/credential-class: fixed-local-development-only
type: Opaque
stringData:
  POSTGRES_DB: threadline
  POSTGRES_PASSWORD: threadline-postgres-dev-only
  POSTGRES_USER: threadline_postgres_dev
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-dev-only-credentials
  namespace: threadline-dev
  annotations:
    threadline.io/credential-class: fixed-local-development-only
type: Opaque
stringData:
  NATS_PASSWORD: threadline-nats-dev-only
  NATS_USER: threadline_nats_dev
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-dev-only-credentials
  namespace: threadline-dev
  annotations:
    threadline.io/credential-class: fixed-local-development-only
type: Opaque
stringData:
  REDIS_PASSWORD: threadline-redis-dev-only
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-dev-only-credentials
  namespace: threadline-dev
  annotations:
    threadline.io/credential-class: fixed-local-development-only
type: Opaque
stringData:
  MINIO_ROOT_PASSWORD: threadline-minio-dev-only
  MINIO_ROOT_USER: threadline_minio_dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: threadline-dev
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      filter/telemetry_guard:
        error_mode: propagate
        traces:
          span:
            # Collector 0.107 has no per-link transform context. Fail closed
            # rather than forward uninspected link attributes.
            - Len(links) > 0
        metrics:
          metric:
            - name != "threadline.dev.operation.duration" and name != "threadline.dev.operation.count" and name != "threadline.dev.operation.errors"
          datapoint:
            # Exemplars can contain filtered attributes that are outside the
            # datapoint allowlist below.
            - Len(exemplars) > 0
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      transform/telemetry_guard:
        # A guard failure drops the payload; it never bypasses redaction.
        error_mode: propagate
        trace_statements:
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name", "deployment.environment.name"])
              - set(attributes["service.name"], "threadline-dev")
              - set(attributes["deployment.environment.name"], "development")
          - context: scope
            statements:
              - keep_keys(attributes, ["threadline.telemetry.guard"])
              - set(attributes["threadline.telemetry.guard"], "v1")
              - set(name, "threadline.instrumentation")
              - set(version, "")
          - context: span
            statements:
              - keep_keys(attributes, ["threadline.telemetry.class"])
              - set(attributes["threadline.telemetry.class"], "operation")
              - set(name, "threadline.operation")
              - set(status.message, "")
              - set(trace_state, "")
          - context: spanevent
            statements:
              - keep_keys(attributes, ["threadline.telemetry.class"])
              - set(attributes["threadline.telemetry.class"], "event")
              - set(name, "threadline.event")
        metric_statements:
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name", "deployment.environment.name"])
              - set(attributes["service.name"], "threadline-dev")
              - set(attributes["deployment.environment.name"], "development")
          - context: scope
            statements:
              - keep_keys(attributes, ["threadline.telemetry.guard"])
              - set(attributes["threadline.telemetry.guard"], "v1")
              - set(name, "threadline.instrumentation")
              - set(version, "")
          - context: metric
            statements:
              - set(description, "")
              - set(unit, "ms") where name == "threadline.dev.operation.duration"
              - set(unit, "1") where name != "threadline.dev.operation.duration"
          - context: datapoint
            statements:
              - keep_keys(attributes, ["threadline.telemetry.class"])
              - set(attributes["threadline.telemetry.class"], "metric")
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, filter/telemetry_guard, transform/telemetry_guard, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/telemetry_guard, transform/telemetry_guard, batch]
          exporters: [otlp/jaeger]
      telemetry:
        logs:
          level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: threadline-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
      - job_name: threadline-otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: threadline-dev
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: threadline-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
          imagePullPolicy: Never
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-dev-only-credentials, key: POSTGRES_DB}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-dev-only-credentials, key: POSTGRES_PASSWORD}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-dev-only-credentials, key: POSTGRES_USER}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe: &postgres-probe
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            <<: *postgres-probe
            initialDelaySeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: threadline-dev
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: threadline-dev
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: nats}
  template:
    metadata:
      labels: {app: nats}
    spec:
      serviceAccountName: nats
      automountServiceAccountToken: false
      containers:
        - name: nats
          image: nats:2.10.20-alpine@sha256:2c19fe5c950ed2ea9e8c9d1f16d89d2f4a2595e51fa0d3ac37d8c537be30aec9
          imagePullPolicy: Never
          command: [sh, -c]
          args:
            - exec nats-server --jetstream --store_dir=/data --http_port=8222
              --user="$NATS_USER" --pass="$NATS_PASSWORD"
          env:
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: {name: nats-dev-only-credentials, key: NATS_PASSWORD}
            - name: NATS_USER
              valueFrom:
                secretKeyRef: {name: nats-dev-only-credentials, key: NATS_USER}
          ports:
            - {name: nats, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe: &nats-probe
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            periodSeconds: 5
          livenessProbe:
            <<: *nats-probe
            initialDelaySeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: threadline-dev
spec:
  selector: {app: nats}
  ports:
    - {name: nats, port: 4222, targetPort: nats}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: threadline-dev
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
          imagePullPolicy: Never
          command: [sh, -c]
          args: ['exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: redis-dev-only-credentials, key: REDIS_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe: &redis-probe
            exec:
              command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
          livenessProbe:
            <<: *redis-probe
            initialDelaySeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: threadline-dev
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: threadline-dev
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-07-16T23-46-41Z@sha256:77ff9f7e12549d269990b167fa21da010fa8b0beb40d6064569b8887e37c456b
          imagePullPolicy: Never
          args: [server, /data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio-dev-only-credentials, key: MINIO_ROOT_PASSWORD}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio-dev-only-credentials, key: MINIO_ROOT_USER}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: threadline-dev
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
    - {name: console, port: 9001, targetPort: console}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: threadline-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.107.0@sha256:b65527791431d76d058b2813748a3f4a8912540d7b23beac2f6b4e02c872f5b7
          imagePullPolicy: Never
          args: [--config=/etc/otelcol-contrib/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
            - {name: health, containerPort: 13133}
          readinessProbe: &otel-probe
            httpGet: {path: /, port: health}
          livenessProbe:
            <<: *otel-probe
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: threadline-dev
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8889, targetPort: metrics}
    - {name: health, port: 13133, targetPort: health}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: threadline-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          imagePullPolicy: Never
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe: &prometheus-probe
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: threadline-dev
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: threadline-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      serviceAccountName: jaeger
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
          imagePullPolicy: Never
          env:
            - name: JAEGER_LISTEN_HOST
              value: 0.0.0.0
          args:
            - --set=extensions.healthcheckv2.http.endpoint=0.0.0.0:13133
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: health, containerPort: 13133}
          readinessProbe: &jaeger-probe
            httpGet: {path: /status, port: health}
          livenessProbe:
            <<: *jaeger-probe
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: threadline-dev
spec:
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: health, port: 13133, targetPort: health}
