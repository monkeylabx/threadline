[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/client-core",
  "crates/client-crypto",
  "crates/client-ffi",
  "crates/connectord",
  "crates/locald",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
