<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Prototype composer geometry</title>
<style>body{margin:0;font:14px system-ui}header{padding:8px;display:flex;gap:12px;align-items:center}iframe{display:block;border:0;width:100%;height:800px}output{white-space:pre-wrap}</style></head>
<body>
<header><label>参考文字大小<select id="scale"><option value="100">100%</option><option value="200">200%</option></select></label><label><input id="legacy" type="checkbox">模拟旧原型固定高度</label><button id="check">检查原型输入框</button><output id="result">等待原型载入</output></header>
<iframe title="输入框原型参考" src="../index.html?viewport=desktop&amp;screen=channel&amp;prototype=im-agent-fusion&amp;variant=A&amp;ui=v34"></iframe>
<script type="module">
const frame = document.querySelector("iframe");
const scale = document.querySelector("select");
const output = document.querySelector("output");
const legacy = document.querySelector("#legacy");
function applyScale() {
  const doc = frame.contentDocument;
  if (!doc) return;
  doc.documentElement.style.fontSize = `${scale.value}%`;
  applyMutation();
  output.textContent = "点击检查原型输入框";
}
function applyMutation() {
  const doc = frame.contentDocument;
  if (!doc) return;
  const field = doc.querySelector(".v34-two-pane .v14-message-composer textarea");
  if (!field) return;
  // The old reference: a fixed two-line field that scrolls instead of growing.
  field.style.minHeight = legacy.checked ? "63px" : "";
  field.style.maxHeight = legacy.checked ? "63px" : "";
}
function measure(composer, field, lines) {
  field.value = Array.from({ length: lines }, (_, index) => `第 ${index + 1} 行`).join("\n");
  field.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
  const total = composer.getBoundingClientRect().height;
  return { total, scrolls: field.scrollHeight > field.clientHeight + 1 };
}
function checkComposer() {
  const doc = frame.contentDocument;
  const composer = doc?.querySelector(".v34-two-pane .v14-message-composer");
  const field = composer?.querySelector("textarea");
  const footer = composer?.querySelector("footer");
  if (!composer || !field || !footer) return void (output.textContent = "FAIL composer not ready");
  const factor = Number(scale.value) / 100;
  const near = (actual, expected) => Math.abs(actual - expected * factor) < .75;
  const rest = measure(composer, field, 0), eight = measure(composer, field, 8), twelve = measure(composer, field, 12);
  const cleared = measure(composer, field, 0);
  const toolbar = footer.getBoundingClientRect().height;
  const checks = [
    [near(rest.total, 78) && near(toolbar, 32), `rest=${rest.total} toolbar=${toolbar}`],
    [!eight.scrolls && eight.total > rest.total && eight.total <= 197 * factor + .75, `eight=${eight.total}`],
    [near(twelve.total, 197) && twelve.scrolls, `cap=${twelve.total} scrolls=${twelve.scrolls}`],
    [near(cleared.total, 78), `cleared=${cleared.total}`],
  ];
  output.textContent = `${checks.every(([ok]) => ok) ? "PASS" : "FAIL"} ${scale.value}%: ${checks.map(([ok, text]) => `${ok ? "" : "✗"}${text}`).join(", ")}`;
}
frame.addEventListener("load", applyScale);
scale.addEventListener("change", applyScale);
legacy.addEventListener("change", applyMutation);
document.querySelector("button").addEventListener("click", checkComposer);
</script>
</body></html>
