<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Threadline P0 deployed services</title>
  <desc id="desc">Six Threadline server workloads, three local device services, and private enterprise platform dependencies.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; letter-spacing: 0; }
      .eyebrow { font-size: 13px; font-weight: 700; fill: #2563eb; }
      .title { font-size: 31px; font-weight: 720; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .zone-title { font-size: 13px; font-weight: 700; fill: #475569; }
      .zone-note { font-size: 12px; fill: #64748b; }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-note { font-size: 11px; fill: #64748b; }
      .item { font-size: 12px; fill: #475569; }
      .badge { font-size: 12px; font-weight: 700; fill: #0f766e; }
      .number { font-size: 12px; font-weight: 750; fill: #ffffff; text-anchor: middle; }
      .protocol { font-size: 10px; font-weight: 650; fill: #2563eb; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2; }
      .teal { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.2; }
      .amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.2; }
      .violet { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.2; }
      .line { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow-blue); }
      .teal-line { fill: none; stroke: #0f766e; stroke-width: 2; marker-end: url(#arrow-teal); }
      .bus { fill: none; stroke: #94a3b8; stroke-width: 1.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1600" height="8" fill="#2563eb"/>
  <text class="eyebrow" x="52" y="50">THREADLINE / P0 DEPLOYED SERVICE TOPOLOGY</text>
  <text class="title" x="52" y="88">P0 部署服务总图</text>
  <text class="subtitle" x="52" y="118">精确口径：6 个 Threadline 服务端工作负载；设备本地服务与企业基础设施单独计数。</text>
  <rect x="1280" y="43" width="265" height="42" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
  <text class="badge" x="1322" y="69">6 SERVER WORKLOADS</text>

  <rect x="50" y="150" width="300" height="825" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text class="zone-title" x="76" y="181">AUTHORIZED USER DEVICE</text>
  <text class="zone-note" x="76" y="202">1 个客户端 + 3 个本地服务</text>

  <rect class="blue" x="76" y="228" width="248" height="82" rx="8"/>
  <text class="card-title" x="96" y="258">Threadline Client</text>
  <text class="card-note" x="96" y="281">Desktop · Web · Mobile</text>
  <text class="card-note" x="96" y="298">IM · Task · Approval · Artifact</text>

  <rect class="card" x="76" y="340" width="248" height="104" rx="8"/>
  <text class="card-title" x="96" y="370">threadline-locald</text>
  <text class="card-note" x="96" y="393">Local Message Service</text>
  <text class="card-note" x="96" y="414">SQLite 单写者 · Sync · Context · Search</text>
  <text class="card-note" x="96" y="432">UDS / Named Pipe · Protobuf</text>

  <rect class="violet" x="76" y="474" width="248" height="78" rx="8"/>
  <text class="card-title" x="96" y="504">Encrypted SQLite</text>
  <text class="card-note" x="96" y="527">Messages · Outbox · Cursor · FTS</text>

  <rect class="teal" x="76" y="582" width="248" height="112" rx="8"/>
  <text class="card-title" x="96" y="612">threadline-agentd</text>
  <text class="card-note" x="96" y="635">Local Agent Runtime</text>
  <text class="card-note" x="96" y="656">Run · Tools · Model Adapter · Event</text>
  <text class="card-note" x="96" y="677">只主动连接内网 Runtime Gateway</text>

  <rect class="amber" x="76" y="724" width="248" height="100" rx="8"/>
  <text class="card-title" x="96" y="754">threadline-connectord</text>
  <text class="card-note" x="96" y="777">Workspace Connector</text>
  <text class="card-note" x="96" y="798">Path Grant · Sandbox · Approval</text>

  <rect x="76" y="854" width="248" height="82" rx="8" fill="#eef2f7" stroke="#cbd5e1"/>
  <text class="zone-title" x="96" y="883">LOCAL OWNERSHIP</text>
  <text class="card-note" x="96" y="907">消息缓存、Run 文件、Workspace 明文</text>
  <text class="card-note" x="96" y="925">不挂载到服务端，不通过共享盘同步</text>

  <path class="bus" d="M200 310 L200 340"/>
  <path class="bus" d="M200 444 L200 474"/>
  <path class="teal-line" d="M200 582 L200 552"/>
  <path class="teal-line" d="M200 694 L200 724"/>

  <rect x="390" y="150" width="830" height="825" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="zone-title" x="416" y="181">THREADLINE-OWNED WORKLOADS · ENTERPRISE PRIVATE NETWORK</text>
  <text class="zone-note" x="882" y="181">统一版本发布 · 独立扩缩容 · 无公网入站</text>

  <rect x="420" y="208" width="770" height="90" rx="8" fill="#eef4ff" stroke="#93c5fd"/>
  <text class="zone-title" x="442" y="235">ENTERPRISE INGRESS · PLATFORM COMPONENT · NOT COUNTED</text>
  <text class="card-title" x="442" y="265">Internal DNS / TLS Termination / Routing</text>
  <text class="card-note" x="767" y="265">/ → web · /api → core · /realtime → realtime · /runtime → runtime-gateway</text>

  <rect class="blue" x="420" y="330" width="230" height="126" rx="8"/>
  <circle cx="444" cy="354" r="13" fill="#2563eb"/>
  <text class="number" x="444" y="358">1</text>
  <text class="card-title" x="466" y="359">threadline-web</text>
  <text class="item" x="444" y="389">Web IM · Admin UI</text>
  <text class="item" x="444" y="412">静态资源 · CSP · 版本信息</text>
  <text class="card-note" x="444" y="435">无业务状态，不访问数据库</text>

  <rect class="blue" x="680" y="330" width="510" height="190" rx="8"/>
  <circle cx="704" cy="354" r="13" fill="#2563eb"/>
  <text class="number" x="704" y="358">2</text>
  <text class="card-title" x="726" y="359">threadline-core</text>
  <text class="card-note" x="1090" y="359">事务性领域事实入口</text>
  <line x1="704" y1="377" x2="1166" y2="377" stroke="#bfdbfe"/>
  <text class="item" x="704" y="405">Identity / Organization · Channel / Membership</text>
  <text class="item" x="704" y="430">Message Command / Sequencer · Sync Query</text>
  <text class="item" x="704" y="455">File Metadata · Device / Key · Task / Approval</text>
  <text class="item" x="704" y="480">Audit / Retention · Capability Grant · Signed Upload</text>
  <rect x="704" y="492" width="289" height="18" rx="4" fill="#dbeafe"/>
  <text class="card-note" x="714" y="505">唯一领域数据写入口；提交后才返回 ACK</text>

  <rect class="blue" x="420" y="486" width="230" height="166" rx="8"/>
  <circle cx="444" cy="510" r="13" fill="#2563eb"/>
  <text class="number" x="444" y="514">3</text>
  <text class="card-title" x="466" y="515">threadline-realtime</text>
  <text class="item" x="444" y="546">Client WSS Session</text>
  <text class="item" x="444" y="571">Presence · Typing · Fan-out</text>
  <text class="item" x="444" y="596">Backpressure · Drain · Reconnect</text>
  <text class="card-note" x="444" y="625">消息写入转发给 core</text>
  <text class="card-note" x="444" y="642">无持久业务状态</text>

  <rect class="teal" x="680" y="550" width="245" height="162" rx="8"/>
  <circle cx="704" cy="574" r="13" fill="#0f766e"/>
  <text class="number" x="704" y="578">4</text>
  <text class="card-title" x="726" y="579">runtime-gateway</text>
  <text class="item" x="704" y="610">Runtime Enrollment · mTLS Stream</text>
  <text class="item" x="704" y="635">Heartbeat · Task Dispatch</text>
  <text class="item" x="704" y="660">Run Event · Lease / Fencing Proxy</text>
  <text class="card-note" x="704" y="686">不读取 Workspace，不保存 Prompt</text>

  <rect class="violet" x="945" y="550" width="245" height="162" rx="8"/>
  <circle cx="969" cy="574" r="13" fill="#7c3aed"/>
  <text class="number" x="969" y="578">5</text>
  <text class="card-title" x="991" y="579">threadline-worker</text>
  <text class="item" x="969" y="610">Transactional Outbox Relay</text>
  <text class="item" x="969" y="635">Projection · Notification · Push</text>
  <text class="item" x="969" y="660">Retention · Scan Hook · Retry / DLQ</text>
  <text class="card-note" x="969" y="686">幂等 Consumer，可横向扩展</text>

  <rect class="amber" x="420" y="682" width="230" height="180" rx="8"/>
  <circle cx="444" cy="706" r="13" fill="#b45309"/>
  <text class="number" x="444" y="710">6</text>
  <text class="card-title" x="466" y="711">model-control</text>
  <text class="item" x="444" y="742">Model Registry · Capabilities</text>
  <text class="item" x="444" y="767">Health · Evaluation Score</text>
  <text class="item" x="444" y="792">Routing Policy · Short-lived Grant</text>
  <text class="card-note" x="444" y="820">只返回路由和凭据</text>
  <text class="card-note" x="444" y="839">Prompt 由本地 agentd 直连模型</text>

  <rect x="680" y="748" width="510" height="74" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text class="zone-title" x="704" y="775">DOMAIN EVENT BACKBONE</text>
  <text class="card-note" x="704" y="799">core commit → outbox → worker relay → JetStream → realtime / runtime / projections</text>

  <rect x="680" y="850" width="510" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="zone-title" x="704" y="878">RELEASE BOUNDARY</text>
  <text class="card-note" x="704" y="902">6 个镜像可独立扩缩容，但使用同一协议版本与数据库迁移版本。</text>
  <text class="card-note" x="704" y="921">P0 不继续拆 Identity、Message、File、Task 等微服务。</text>

  <path class="line" d="M324 269 L420 253"/>
  <text class="protocol" x="347" y="245">WSS / CONNECT</text>
  <path class="teal-line" d="M324 638 L370 638 L370 665 L665 665 L665 675 L680 675"/>
  <text class="protocol" x="386" y="659">OUTBOUND mTLS STREAM</text>
  <path class="bus" d="M535 298 L535 330"/>
  <path class="bus" d="M935 298 L935 330"/>
  <path class="bus" d="M443 298 L405 298 L405 569 L420 569"/>
  <path class="line" d="M650 569 L665 569 L665 430 L680 430"/>
  <path class="bus" d="M935 520 L935 748"/>
  <path class="teal-line" d="M802 748 L802 712"/>
  <path class="bus" d="M1068 748 L1068 712"/>
  <path class="bus" d="M680 785 L665 785 L665 615 L650 615"/>
  <path class="teal-line" d="M680 690 L665 690 L665 772 L650 772"/>

  <rect x="1260" y="150" width="290" height="825" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text class="zone-title" x="1284" y="181">PLATFORM &amp; INTEGRATIONS</text>
  <text class="zone-note" x="1284" y="202">企业管理，不计入 6 个 Threadline 服务</text>

  <rect class="blue" x="1284" y="228" width="242" height="94" rx="8"/>
  <text class="card-title" x="1303" y="258">PostgreSQL HA</text>
  <text class="card-note" x="1303" y="281">domain · model · job schemas</text>
  <text class="card-note" x="1303" y="300">同步副本 · PITR · backup</text>
  <rect class="teal" x="1284" y="344" width="242" height="82" rx="8"/>
  <text class="card-title" x="1303" y="374">NATS JetStream</text>
  <text class="card-note" x="1303" y="397">3 nodes · durable consumers</text>
  <rect class="card" x="1284" y="448" width="115" height="74" rx="8"/>
  <text class="card-title" x="1303" y="478">Redis</text>
  <text class="card-note" x="1303" y="501">Session TTL</text>
  <rect class="card" x="1411" y="448" width="115" height="74" rx="8"/>
  <text class="card-title" x="1430" y="478">Vault/HSM</text>
  <text class="card-note" x="1430" y="501">Keys</text>
  <rect class="card" x="1284" y="544" width="242" height="74" rx="8"/>
  <text class="card-title" x="1303" y="574">Object Storage</text>
  <text class="card-note" x="1303" y="597">Encrypted Attachment / Artifact</text>
  <rect class="violet" x="1284" y="640" width="242" height="74" rx="8"/>
  <text class="card-title" x="1303" y="670">Enterprise IdP</text>
  <text class="card-note" x="1303" y="693">OIDC · SAML · LDAP / AD · SCIM</text>
  <rect class="amber" x="1284" y="736" width="242" height="74" rx="8"/>
  <text class="card-title" x="1303" y="766">Internal Model Endpoints</text>
  <text class="card-note" x="1303" y="789">agentd direct · short-lived route grant</text>
  <rect class="teal" x="1284" y="832" width="242" height="74" rx="8"/>
  <text class="card-title" x="1303" y="862">Internal Observability</text>
  <text class="card-note" x="1303" y="885">OTel · Metrics · Logs · Traces</text>
  <rect x="1284" y="928" width="242" height="28" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text class="card-note" x="1303" y="947">Optional: APNs / FCM outbound proxy</text>

  <path class="line" d="M1190 402 L1240 402 L1240 275 L1284 275"/>
  <path class="bus" d="M1190 465 L1248 465 L1248 581 L1284 581"/>
  <path class="teal-line" d="M1190 785 L1236 785 L1236 385 L1284 385"/>
  <path class="bus" d="M650 830 L665 830 L665 946 L1230 946 L1230 773 L1284 773"/>
  <path class="bus" d="M1220 485 L1284 485"/>
  <path class="bus" d="M1220 677 L1284 677"/>
  <path class="teal-line" d="M1220 869 L1284 869"/>

  <rect x="50" y="998" width="1500" height="34" rx="7" fill="#eef2f7" stroke="#cbd5e1"/>
  <text class="zone-note" x="76" y="1020">计数：6 个服务端工作负载 + 3 个设备本地服务 + 6 类生产基础设施；Ingress、企业 IdP、内部模型属于平台或集成。</text>
  <text class="zone-note" x="1435" y="1020">v1 · 2026-07-24</text>
</svg>
