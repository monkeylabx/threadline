name: Secret Scan

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # pull_request_target is safe here only because every executable and
      # configuration file remains from the trusted base commit. PR content is
      # fetched as Git objects and is never checked out or executed.
      - name: Check out trusted base scanner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch untrusted pull request head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash scripts/security/fetch-pr-head.sh
          "${GITHUB_WORKSPACE}"
          "${PR_NUMBER}"
          "${HEAD_SHA}"
      - name: Check scanner shell syntax
        run: bash -n scripts/security/fetch-pr-head.sh scripts/security/install-gitleaks.sh scripts/security/scan-secrets.sh scripts/security/secret-scan.test.sh
      - name: Install pinned Gitleaks
        run: bash scripts/security/install-gitleaks.sh "${RUNNER_TEMP}/threadline-gitleaks"
      - name: Test scanner isolation and redaction
        run: bash scripts/security/secret-scan.test.sh "${RUNNER_TEMP}/threadline-gitleaks/gitleaks"
      - name: Scan exact pull request commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash scripts/security/scan-secrets.sh
          "${RUNNER_TEMP}/threadline-gitleaks/gitleaks"
          "${GITHUB_WORKSPACE}"
          "${BASE_SHA}"
          "${HEAD_SHA}"
