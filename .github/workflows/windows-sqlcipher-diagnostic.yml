name: Windows SQLCipher crash diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/windows-sqlcipher-diagnostic.yml
      - Cargo.lock
      - Cargo.toml
      - crates/client-core/**
      - rust-toolchain.toml
      - scripts/ci/capture-windows-sqlcipher-crash.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-sqlcipher-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LIBSQLITE3_SYS_USE_PKG_CONFIG: "0"

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build once, repeat, and classify
        shell: pwsh
        run: >-
          ./scripts/ci/capture-windows-sqlcipher-crash.ps1
          -ArtifactRoot "${{ runner.temp }}/windows-sqlcipher-diagnostic"
          -Repetitions 3
      - name: Upload executable and transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-sqlcipher-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/windows-sqlcipher-diagnostic
          if-no-files-found: error
          retention-days: 14
