name: Five-platform build baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GOTOOLCHAIN: local

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the breaking-change gate can diff against main.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        run: |
          npm install --global corepack@0.35.0 --force
          corepack enable
          corepack install --global pnpm@11.20.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check protocol contract
        run: node scripts/proto.mjs check
      - name: Check protocol compatibility
        run: node scripts/proto.mjs breaking
      - name: Verify protocol fixtures and contract invariants
        run: node proto/tools/verify-contracts.mjs
      - name: Generate TypeScript SDK
        run: node scripts/proto.mjs generate ts

  workspace-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        run: |
          npm install --global corepack@0.35.0 --force
          corepack enable
          corepack install --global pnpm@11.20.0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify pins and installed tools
        run: |
          node --test scripts/toolchain.test.mjs
          node scripts/toolchain.mjs verify
          node scripts/toolchain.mjs doctor --scope=workspace
      - name: Check TypeScript skeleton
        run: |
          pnpm --filter @threadline/desktop build
          pnpm --filter @threadline/desktop test
          pnpm --filter @threadline/desktop lint
      - name: Check Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --exclude threadline-desktop-host --all-targets --locked -- -D warnings
          cargo test --workspace --exclude threadline-desktop-host --locked
      - name: Run Ubuntu fail-closed community SQLCipher evidence
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: "0"
        run: cargo test -p threadline-client-core --test sqlcipher_backend --locked
      - name: Verify native bridge process crash and cursor resume fixture
        run: |
          CURSOR_FIXTURE="${RUNNER_TEMP}/threadline-native-bridge.cursor"
          CRASH_RESUME_LOG="${RUNNER_TEMP}/threadline-native-bridge-crash-resume.txt"
          set +e
          cargo run --package threadline-client-ffi --example crash_resume --locked -- write "${CURSOR_FIXTURE}"
          CRASH_EXIT=$?
          set -e
          test "${CRASH_EXIT}" -eq 86
          cargo run --package threadline-client-ffi --example crash_resume --locked -- resume "${CURSOR_FIXTURE}" | tee "${CRASH_RESUME_LOG}"
      - name: Upload native bridge crash/resume evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bridge-crash-resume
          path: ${{ runner.temp }}/threadline-native-bridge-crash-resume.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Check Go services
        working-directory: services
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go build ./...

  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: threadline_postgres_dev
          POSTGRES_PASSWORD: threadline_postgres_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=threadline_postgres_dev --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: threadline_postgres_dev
      PGPASSWORD: threadline_postgres_dev
      PGDATABASE: postgres
      THREADLINE_TEST_POSTGRES_DSN: postgres://threadline_postgres_dev:threadline_postgres_dev@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
      - name: Verify mandatory PostgreSQL test environment
        run: |
          test -n "${THREADLINE_TEST_POSTGRES_DSN}"
          test "$(psql --no-psqlrc --tuples-only --no-align --command='SHOW server_version')" = "16.4"
      - name: Test migrations and database contracts
        run: |
          make -C db migration-test
          make -C db organization-test
          make -C db member-test
          make -C db space-test
          make -C db channel-dm-test
          make -C db channel-membership-test
          make -C db resource-acl-test
          make -C db authorization-current-test
          make -C db transactional-outbox-test
          make -C db transactional-outbox-worker-ops-test
      - name: Test all PostgreSQL-backed Go stores
        working-directory: services
        run: go test -mod=readonly -race ./... -count=1

  desktop:
    name: desktop-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        run: |
          npm install --global corepack@0.35.0 --force
          corepack enable
          corepack install --global pnpm@11.20.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify desktop toolchain
        run: node scripts/toolchain.mjs doctor --scope=desktop
      - name: Run Windows fail-closed community SQLCipher evidence
        if: runner.os == 'Windows'
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: "0"
        run: cargo test -p threadline-client-core --test sqlcipher_backend --locked
      - name: Build unsigned Tauri host
        run: pnpm --filter @threadline/desktop build:native

  apple:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        run: |
          npm install --global corepack@0.35.0 --force
          corepack enable
          corepack install --global pnpm@11.20.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Apple and desktop toolchains
        run: node scripts/toolchain.mjs doctor --scope=apple,desktop
      - name: Run macOS fail-closed community SQLCipher evidence
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: "0"
        run: cargo test -p threadline-client-core --test sqlcipher_backend --locked
      - name: Build host FFI facade for Swift tests
        run: cargo build --package threadline-client-ffi --locked
      - name: Test Swift package through the Rust facade
        env:
          THREADLINE_FFI_LIBRARY_DIR: ${{ github.workspace }}/target/debug
        run: swift test --package-path apps/ios --scratch-path "${RUNNER_TEMP}/threadline-swift"
      - name: Build universal FFI facade for iOS Simulator
        run: |
          rustup target add aarch64-apple-ios-sim x86_64-apple-ios
          cargo build --package threadline-client-ffi --release --target aarch64-apple-ios-sim --locked
          cargo build --package threadline-client-ffi --release --target x86_64-apple-ios --locked
          mkdir -p target/ios-simulator-universal/release
          lipo -create \
            target/aarch64-apple-ios-sim/release/libthreadline_client_ffi.a \
            target/x86_64-apple-ios/release/libthreadline_client_ffi.a \
            -output target/ios-simulator-universal/release/libthreadline_client_ffi.a
      - name: Test Rust facade inside a booted iOS Simulator
        env:
          THREADLINE_FFI_LIBRARY_DIR: ${{ github.workspace }}/target/ios-simulator-universal/release
        run: bash scripts/ci/run-ios-simulator-ffi.sh
      - name: Summarize iOS Simulator evidence
        if: always()
        run: |
          RESULT_BUNDLE="${RUNNER_TEMP}/threadline-ios-simulator.xcresult"
          if [[ -d "${RESULT_BUNDLE}" ]]; then
            xcrun xcresulttool get test-results summary --path "${RESULT_BUNDLE}" || true
          fi
      - name: Upload iOS Simulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bridge-ios-simulator
          path: ${{ runner.temp }}/threadline-ios-simulator.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Build unsigned macOS Tauri host
        run: pnpm --filter @threadline/desktop build:native

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        run: |
          npm install --global corepack@0.35.0 --force
          corepack enable
          corepack install --global pnpm@11.20.0
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17.0.19+10
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@16f3e46a58d2b926c34615132d7969a96bccb22b # v6.0.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install pinned Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${SDKMANAGER}"
          "${SDKMANAGER}" \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify pins and Android toolchain
        run: node scripts/toolchain.mjs doctor --scope=android
      - name: Cross-compile FFI facade for Android device and Emulator
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          AARCH64_LINKER="${ANDROID_SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          X86_64_LINKER="${ANDROID_SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android28-clang"
          test -x "${AARCH64_LINKER}"
          test -x "${X86_64_LINKER}"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${AARCH64_LINKER}" cargo build --package threadline-client-ffi --release --target aarch64-linux-android --locked
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${X86_64_LINKER}" cargo build --package threadline-client-ffi --release --target x86_64-linux-android --locked
          install -D \
            target/aarch64-linux-android/release/libthreadline_client_ffi.so \
            apps/android/src/main/jniLibs/arm64-v8a/libthreadline_client_ffi.so
          install -D \
            target/x86_64-linux-android/release/libthreadline_client_ffi.so \
            apps/android/src/main/jniLibs/x86_64/libthreadline_client_ffi.so
      - name: Build host FFI facade for Kotlin tests
        run: cargo build --package threadline-client-ffi --locked
      - name: Build and test Android skeleton
        working-directory: apps/android
        env:
          THREADLINE_FFI_LIBRARY_DIR: ${{ github.workspace }}/target/debug
        run: >-
          ./gradlew
          assembleDebug
          testDebugUnitTest
          lintDebug
          --no-daemon
      - name: Allow the Android Emulator to use KVM
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chown "${USER}" /dev/kvm
          fi
      - name: Test Rust facade inside a booted Android Emulator
        env:
          THREADLINE_FFI_LIBRARY_DIR: ${{ github.workspace }}/target/debug
        run: bash scripts/ci/run-android-emulator-ffi.sh
      - name: Upload Android JVM and Emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bridge-android-emulator
          path: |
            apps/android/build/test-results/
            apps/android/build/reports/tests/
            apps/android/build/outputs/androidTest-results/
            apps/android/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
